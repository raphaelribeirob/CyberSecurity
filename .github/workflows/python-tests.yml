name: Portfolio learning-lab tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local network lab tests
        run: python -m unittest discover -s network-security-lab/tests -v
      - name: Run independent synthetic security-controls tests
        run: python -m unittest discover -s security-case-studies/examples/tests -v
